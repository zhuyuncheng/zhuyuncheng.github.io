eSI6MjY3fSx7IngiOjM2MS42MDk0NjU4NDMwMjMyNiwieSI6MzA0fV0=" data-look="classic" marker-end="url(#my-svg_flowchart-v2-pointEnd)"/><path d="M560.953,514L560.953,530.167C560.953,546.333,560.953,578.667,548.975,600.707C536.997,622.746,513.04,634.493,501.062,640.366L489.084,646.239" id="my-svg-L_Distill_Output_0" class="edge-thickness-normal edge-pattern-dotted edge-thickness-normal edge-pattern-solid flowchart-link" style=";" data-edge="true" data-et="edge" data-id="L_Distill_Output_0" data-points="W3sieCI6NTYwLjk1MzEyNSwieSI6NTE0fSx7IngiOjU2MC45NTMxMjUsInkiOjYxMX0seyJ4Ijo0ODUuNDkyNTk4Njg0MjEwNSwieSI6NjQ4fV0=" data-look="classic" marker-end="url(#my-svg_flowchart-v2-pointEnd)"/></g><g class="edgeLabels"><g class="edgeLabel"><g class="label" data-id="L_Input_Think_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_Think_Output_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel" transform="translate(391.9375, 267)"><g class="label" data-id="L_GRPO_Think_0" transform="translate(-64, -12)"><foreignObject width="128" height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"><p>赋予显式推理能力</p></span></div></foreignObject></g></g><g class="edgeLabel" transform="translate(560.953125, 611)"><g class="label" data-id="L_Distill_Output_0" transform="translate(-32, -12)"><foreignObject width="64" height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"><p>知识传递</p></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default" id="my-svg-flowchart-Input-0" data-look="classic" transform="translate(109.96875, 119)"><rect class="basic label-container" style="fill:#1e2a3a !important" x="-101.96875" y="-39" width="203.9375" height="78"/><g class="label" style="color:#c0d8f0 !important" transform="translate(-71.96875, -24)"><rect/><foreignObject width="143.9375" height="48"><div style="color: rgb(192, 216, 240) !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#c0d8f0 !important" class="nodeLabel"><p>📥 用户输入<br />Q: 证明 √2 是无理数</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-Think-2" data-look="classic" transform="translate(250.953125, 439)"><rect class="basic label-container" style="fill:#0f2a45 !important;stroke:#2a5a8a !important;stroke-width:2px !important" x="-130" y="-135" width="260" height="270"/><g class="label" style="color:#b0d0f0 !important" transform="translate(-100, -120)"><rect/><foreignObject width="200" height="240"><div style="color: rgb(176, 208, 240) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#b0d0f0 !important" class="nodeLabel"><p>&lt;think&gt;<br />① 假设 √2 = p/q 为最简分数<br />② 则 2q² = p²，推出 p 为偶数<br />③ 令 p=2k，代入得 q 也为偶数<br />④ 与最简分数矛盾 → 假设不成立<br />&lt;/think&gt;</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-Output-4" data-look="classic" transform="translate(405.953125, 687)"><rect class="basic label-container" style="fill:#1e2a3a !important" x="-112.8046875" y="-39" width="225.609375" height="78"/><g class="label" style="color:#c0d8f0 !important" transform="translate(-82.8046875, -24)"><rect/><foreignObject width="165.609375" height="48"><div style="color: rgb(192, 216, 240) !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#c0d8f0 !important" class="nodeLabel"><p>📤 最终答案<br />√2 是无理数（反证法）</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-GRPO-5" data-look="classic" transform="translate(391.9375, 119)"><rect class="basic label-container" style="fill:#1a3a1a !important;stroke:#2a6a2a !important" x="-130" y="-111" width="260" height="222"/><g class="label" style="color:#90c090 !important" transform="translate(-100, -96)"><rect/><foreignObject width="200" height="192"><div style="color: rgb(144, 192, 144) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#90c090 !important" class="nodeLabel"><p>🎓 GRPO 训练机制<br />Group Relative Policy Optimization<br />• 并行采样 G 个候选答案<br />• 组内相对奖励替代 Critic Model<br />• 训练成本比 PPO 降低约 50%</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-Distill-8" data-look="classic" transform="translate(560.953125, 439)"><rect class="basic label-container" style="fill:#1a2a3a !important;stroke:#2a4a7a !important" x="-130" y="-75" width="260" height="150"/><g class="label" style="color:#90a0d0 !important" transform="translate(-100, -60)"><rect/><foreignObject width="200" height="120"><div style="color: rgb(144, 160, 208) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#90a0d0 !important" class="nodeLabel"><p>🔬 蒸馏链路<br />R1-671B → 32B → 14B → 7B<br />继承完整推理链，成本降低 10~100x</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs></svg>